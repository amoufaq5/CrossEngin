name: crossengin

# CrossEngin on a single VM: Postgres (+pg_uuidv7), a one-shot schema migrate,
# the operate-server API, the operate-web UI, and Caddy for automatic HTTPS.
# Everything reads deploy/.env — copy deploy/.env.example to deploy/.env first.

x-app-build: &app-build
  context: ..
  dockerfile: deploy/Dockerfile

# Memory: every long-running service carries a `mem_limit`, overridable from .env (DB_, API_, WEB_,
# BACKUP_, CADDY_MEMORY_LIMIT), so one runaway process is killed and restarted rather than taking the
# host — and the database — down with it. Measured idle after 300 API and 200 web requests on
# erp-core: api 101 MiB, web 106 MiB, db 80 MiB, backup 2 MiB between runs. The defaults are about
# ten times that for the API, whose integrity proof loads a scope's whole chain into the heap, and
# five times for the rest; Node sizes its heap from the container limit, so the limit also caps it.
# The one-shot services run for seconds and carry none.
#
# Every service logs through this. Docker's default json-file driver keeps a container's log for
# ever, so a long-lived `api` fills the disk the database lives on; 5 x 10 MB per container is a
# bound, and `docker compose logs` still reads it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The OWNER's connection: `extensions`, `migrate` and `app-role` create and alter the catalog, so
# they run as POSTGRES_USER. The `api` overrides PGUSER/PGPASSWORD with the app role below and is the
# one service that must not use these two values: as the owner every RLS policy is inert.
x-pg-env: &pg-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGDATABASE: ${POSTGRES_DB}

services:
  db:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-h 127.0.0.1` is load-bearing and is the whole of the difference between this gate working
      # and being a coin flip on a first `up`.
      #
      # Without a host, `pg_isready` probes the **Unix socket** — and on the very first
      # initialisation the official entrypoint starts a *temporary* server with
      # `listen_addresses=''`, socket only and no TCP, specifically so it can run
      # `/docker-entrypoint-initdb.d/*` before the database is reachable. So a socket probe reports
      # `accepting connections` during a window in which **nothing is listening on 5432**, Compose
      # marks `db` healthy, and every dependent gated on `service_healthy` connects over TCP to
      # `db:5432` and is refused. For the one-shot `extensions` service that surfaces as
      # `psql: error: connection to server at "db" … failed` and **exit 2** — psql's documented code
      # for *the connection to the server went bad*, which is also why it is not exit 3, the code for
      # a script error under `ON_ERROR_STOP=1`. The two are worth telling apart: 3 means the SQL in
      # `00-extension.sql` failed and the extension is the thing to look at, 2 means it never got to
      # run it.
      #
      # With a host it is a TCP probe, so the check cannot pass until the real server is listening —
      # which is after initdb and after the init scripts. It strictly tightens the gate: every state
      # that answered healthy before and was genuinely serving still answers healthy, and the only
      # states it newly refuses are the ones where a dependent would have failed. `pg_isready`
      # authenticates nothing, so this needs no password and is unaffected by `pg_hba` rules.
      #
      # Reasoned from psql's exit codes and the entrypoint's documented behaviour, not reproduced:
      # there is no Docker daemon in the environment this was written in. The discriminator on a
      # real host is `docker compose logs extensions` — a refused connection is this race, while
      # `role … does not exist` or `password authentication failed` is a `.env` problem instead.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    logging: *logging
    restart: unless-stopped

  # One-shot, on EVERY `up`: makes sure uuid_generate_v7() exists before the migrate step needs it.
  #
  # `postgres/init/00-extension.sql` is mounted into `db` as well, but the entrypoint runs
  # /docker-entrypoint-initdb.d ONLY on the first initialisation of an empty data directory — so a
  # `db-data` volume that already holds a cluster never sees it again. That is not a hypothetical:
  # the previous postgres image installed pg_uuidv7 from a GitHub release whose only prebuilt .so is
  # x86_64, so on arm64 (every Apple-silicon laptop, every Oracle Ampere A1 shape) `CREATE EXTENSION`
  # failed under ON_ERROR_STOP=1 *after* initdb had written PG_VERSION. Fixing the image does not
  # repair such a volume: initdb is skipped, the container reports healthy, and `crossengin apply`
  # exits 1 with `PRECONDITIONS FAILED — no statements were executed … [MISSING_EXTENSION]` on every
  # `up`, forever. A precondition the migrate step needs on every run cannot live only in a hook that
  # runs once.
  #
  # The same file, run by both, rather than a second copy of the SQL: `CREATE EXTENSION IF NOT
  # EXISTS` is idempotent, and pgcrypto stays inside its DO block there so a server without it still
  # exits 0 (see that file for why the two extensions are deliberately asymmetric). Built from
  # ./postgres because that image is the one carrying psql; the extension's .so has to be on the
  # *server*, which is `db`, so this container only issues the statement.
  extensions:
    build:
      context: ./postgres
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *pg-env
    volumes:
      - ./postgres/init:/init:ro
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-f", "/init/00-extension.sql"]
    logging: *logging
    restart: "no"

  # One-shot: applies the meta-schema (idempotent — safe to re-run on every `up`).
  migrate:
    build: *app-build
    depends_on:
      db:
        condition: service_healthy
      extensions:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
    # Each statement waits at most 5 s for its lock (retried twice) and runs at most 10 minutes, so
    # an upgrade beside a busy API fails and names the table rather than queueing every query behind
    # it; add --lock-timeout-ms 0 to wait indefinitely. README: "Before an upgrade that changes the
    # schema", which is also where the backup goes — there is no down-migration.
    command: ["node", "apps/architect-cli/dist/bin/crossengin.js", "apply", "--confirm"]
    logging: *logging
    restart: "no"

  # The role the API connects as: NOSUPERUSER, NOBYPASSRLS, owning nothing, DML on the catalog.
  #
  # On every `up` and after `migrate`, for the `extensions` service's reason: the image's init hook
  # runs once per volume, and runs before `meta` exists. Idempotent — it re-asserts the attributes,
  # follows POSTGRES_APP_PASSWORD (so changing it and re-running `up` rotates it), and grants every
  # table `migrate` added. It refuses by name, and `api` then never starts, when the password is
  # empty, still the .env.example placeholder or under 16 characters, or when the role would bypass
  # RLS anyway (it names POSTGRES_USER, is a member of it, or owns a meta table). The name and
  # password reach psql through the environment (`\getenv`), never argv (ADR-0301).
  app-role:
    build:
      context: ./postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      # Both fall back to the owner, so an upgraded .env that predates the split lands on the
      # declared opt-out (the API keeps answering as it did, and its boot line says BYPASSES) rather
      # than on a refusal that leaves `api` created and never started. A fresh .env carries both
      # lines, the password as a placeholder this script refuses (ADR-0424).
      CROSSENGIN_APP_DB_USER: ${POSTGRES_APP_USER:-${POSTGRES_USER}}
      CROSSENGIN_APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - ./postgres/roles:/roles:ro
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-f", "/roles/app-role.sql"]
    logging: *logging
    restart: "no"

  # The Article 17 deletion role (ADR-0458): NOSUPERUSER, BYPASSRLS, owning nothing, holding exactly
  # what an erasure uses. Opt-in and a no-op until DELETION_PGUSER is set; a DELETION_PGUSER naming
  # POSTGRES_USER (ADR-0453's configuration) is left alone and said. Re-run on every `up`, which is
  # what re-grants a table `migrate` added since. After `app-role`, so the app role it must never be
  # (or be reachable from) already exists to be compared against.
  eraser-role:
    build:
      context: ./postgres
    depends_on:
      app-role:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      CROSSENGIN_ERASER_DB_USER: ${DELETION_PGUSER:-}
      CROSSENGIN_ERASER_DB_PASSWORD: ${DELETION_PGPASSWORD:-}
      CROSSENGIN_APP_DB_USER: ${POSTGRES_APP_USER:-${POSTGRES_USER}}
      CROSSENGIN_APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - ./postgres/roles:/roles:ro
    entrypoint: ["psql"]
    command: ["-v", "ON_ERROR_STOP=1", "-f", "/roles/eraser-role.sql"]
    logging: *logging
    restart: "no"

  # The unique indexes `--store pg` enforces a declared `unique` field with (ADR-0423). They are
  # expression indexes on the one shared document table, so only that table's OWNER can create them
  # -- Postgres refuses CREATE INDEX to anyone else, IF NOT EXISTS included -- and the API connects
  # as the confined app role (ADR-0424), which owns nothing. So the owner builds them here, after
  # `migrate` and before `api`, for the same pack the API serves. The API reads each one back from
  # pg_index at boot and counts it enforced; `[unique]` names any it could not find. Exit 0 with a
  # warning when existing rows already hold a duplicate: that index is left absent and reported,
  # which is the state before this service existed, rather than a stack that will not start.
  document-indexes:
    build: *app-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
    command:
      ["node", "apps/operate-server/dist/bin/operate-server.js", "document-indexes", "--pack", "${OPERATE_PACK:-erp-core}"]
    logging: *logging
    restart: "no"

  api:
    build: *app-build
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-role:
        condition: service_completed_successfully
      eraser-role:
        condition: service_completed_successfully
      document-indexes:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      # Not POSTGRES_USER: the image makes that a superuser holding BYPASSRLS and owning every table
      # `migrate` creates, and any one of the three makes every row-level-security policy inert for
      # the session. The boot line `[pg] row-level security:` says which this process got.
      PGUSER: ${POSTGRES_APP_USER:-${POSTGRES_USER}}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      # The one exception to the confined role (ADR-0453): an Article 17 deletion must empty tables
      # the app role's policies confine, so the deletion pipeline — and nothing else — connects as
      # the role named here, on its own connection. The `eraser-role` step above provisions it as a
      # dedicated NOSUPERUSER BYPASSRLS role (ADR-0458). Opt-in: empty means deletions run on the app role
      # and are refused rls_would_confine_this_session; the `[deletion]` boot line says which. None of
      # the deletion flags is on the command below, so setting these alone changes nothing.
      DELETION_PGUSER: ${DELETION_PGUSER:-}
      DELETION_PGPASSWORD: ${DELETION_PGPASSWORD:-}
      NODE_ENV: production
      # Credentials reach the API through the environment, not through `command`, because argv is
      # readable by anyone who can run `ps` (ADR-0301). `${VAR:-}` passes an empty value when the
      # variable is unset, and every reader here treats empty as unset — so an absent provider is
      # simply not registered rather than half-configured.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The rest of the AI configuration, so every provider path is reachable from .env without
      # editing the command below. OPENAI_BASE_URL points the OpenAI provider at any
      # OpenAI-compatible host (the prefix BEFORE /v1); a third-party model then needs a declared
      # price (OPERATE_AI_MODEL_PRICE, "0:0" for a free one) or the boot refuses it, and a free
      # host's per-minute token allowance usually needs a smaller OPERATE_AI_MAX_OUTPUT_TOKENS.
      # LOCAL_LLM_BASE_URL is the self-hosted route; the AI overlay sets it for you.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      OPERATE_AI_MODEL: ${OPERATE_AI_MODEL:-}
      OPERATE_AI_MODEL_PRICE: ${OPERATE_AI_MODEL_PRICE:-}
      OPERATE_AI_MAX_OUTPUT_TOKENS: ${OPERATE_AI_MAX_OUTPUT_TOKENS:-}
      OPERATE_AI_PROVIDER_TIMEOUT_MS: ${OPERATE_AI_PROVIDER_TIMEOUT_MS:-}
      SES_REGION: ${SES_REGION:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      SES_FROM_NAME: ${SES_FROM_NAME:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_ENDPOINT_URL: ${SES_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_BASE_URL: ${TWILIO_BASE_URL:-}
      NOTIFICATION_BOUNCE_SECRET: ${NOTIFICATION_BOUNCE_SECRET:-}
      # The master secret at-rest column encryption derives each tenant's key from (HKDF-SHA256,
      # salted with the tenant id). Needed only by a pack declaring phi/regulated fields, and only
      # on --store pg-columns; see the OPERATE_PACK note below. In the environment and never in
      # `command:` below, because argv is readable via ps.
      COLUMN_ENCRYPTION_SECRET: ${COLUMN_ENCRYPTION_SECRET:-}
      # Seals the entity-list keyset cursor (AES-256-GCM under a per-tenant HKDF key). Set this on
      # ANY deployment whose manifest classifies a sortable field: the cursor carries the plaintext
      # of every declared sort key, so `?sort=<classified field>` hands back in `nextCursor` what
      # the response body redacts from the same caller. That includes THIS deployment --
      # erp-core's `Employee.work_email` is `pii` and sortable, reproduced live as a caller holding
      # the list grant and not the field's read grant -- so the boot log says
      # `cursor disclosure: plaintext_disclosing` until this is set. Unset, a cursor is reversible
      # base64url JSON. 32+ random bytes; changing it only costs cursors in flight (one 400 and a
      # restarted page walk).
      CURSOR_ENCRYPTION_SECRET: ${CURSOR_ENCRYPTION_SECRET:-}
      # The api-key specs (`token:role:tenant[:principal]`), newline- or comma-separated. A spec's
      # token IS the credential, so it belongs here and not in `command:` below — argv is readable
      # via `ps` by any user on the host. Until this variable existed the flag was the only route,
      # which is why the comment two lines above said one thing and the command said another.
      OPERATE_API_KEY_SPECS: ${OPERATE_ADMIN_API_KEY}
      # The pepper HMAC'd into a password before scrypt stretches it, and the Ed25519 seed this
      # deployment signs session tokens with. Both here and never in `command:` for the reason
      # above. `meta.users` carries no tenant_id and so no RLS, which means the password hashes are
      # readable by anything holding the serving role's grant -- the pepper is what makes reading
      # that table insufficient, because it is not in the database.
      #
      # The signing key is ONE variable: the public half is DERIVED from the seed and registered in
      # the gateway's own JWKS, so there is no second value to keep in step. 32 bytes of base64
      # (`node -e 'console.log(require("node:crypto").randomBytes(32).toString("base64"))'`).
      # Changing it invalidates every session in flight -- one 401 and a re-login.
      CREDENTIAL_PEPPER: ${CREDENTIAL_PEPPER:-}
      OPERATE_TOKEN_SIGNING_KEY: ${OPERATE_TOKEN_SIGNING_KEY:-}
      # The Ed25519 seed the audit chain signs entries with -- the thing that makes an edited or
      # deleted audit row detectable at all (ADR-0286). Here and never in `command:` for the reason
      # above, and never in a file under `deploy/` either: `Dockerfile`'s `COPY . .` runs under a
      # repo-root build context with `.dockerignore` matching nothing there, so a seed in a file is
      # baked into a layer that `docker save` and every registry push carry -- worse than argv
      # rather than an alternative to it. Until this variable existed `--audit-chain-config <file>`
      # was the only route to it, so no shipped compose could anchor anything and the two
      # schedulers below had no chain to witness.
      #
      # ONE variable: the public half is DERIVED (the same decision, for the same measured reason,
      # as OPERATE_TOKEN_SIGNING_KEY above). `--audit-chain-config` still works and may now carry
      # the chain's policy with no key in it; both sources may carry a key only if they state the
      # same one, compared by fingerprint.
      AUDIT_CHAIN_SIGNING_KEY: ${AUDIT_CHAIN_SIGNING_KEY:-}
    # Args in list form so no value is ever shell-split.
    command:
      - node
      - apps/operate-server/dist/bin/operate-server.js
      # erp-core declares no phi/regulated field, so this default serves on the JSONB store below.
      # erp-healthcare (4 such fields) and erp-government (Citizen.national_id) do, and the JSONB
      # store cannot encrypt a column -- it would hold them as plaintext -- so setting OPERATE_PACK
      # to either one is REFUSED at boot. To serve one, switch `--store` to `pg-columns` and set
      # COLUMN_ENCRYPTION_SECRET above. `--allow-plaintext-phi` overrides the refusal and is what
      # its name says: the fields are stored in the clear.
      #
      # On such a deployment, `--column-key-mode envelope` stores each tenant's column key as a
      # random data key, wrapped under a key derived from COLUMN_ENCRYPTION_SECRET, so destroying
      # that row is expressible -- which is what bounds the recovery horizon after an Article 17
      # erasure. Note what it does NOT buy: the wrapped key and the ciphertext are in this same
      # database, so one backup holds both, and the bound is this deployment's backup retention
      # rather than the destruction itself. A tenant that already holds ciphertext written under
      # the derived key is SEEDED from it (so their data stays readable) and its row records
      # `seeded_from_derived`, which is still recomputable from the secret -- so destroying it
      # destroys nothing until that tenant is rekeyed. `operate-server rekey --tenant <id>
      # --confirm-tenant <id>` is that executor: it mints a random key, re-encrypts that tenant's
      # columns under it and retires the old generation, in one transaction.
      - --pack
      - ${OPERATE_PACK:-erp-core}
      - --store
      - pg
      - --port
      - "8787"
      - --scheme
      - https
      - --platform-admin
      # Mounts POST /v1/platform/users — provision a principal, grant it a membership in a tenant,
      # retire it. Without it there is no route that creates the user `set-credential` sets a
      # password on, so the documented first-user step below could not be carried out at all: the
      # comment two blocks down named this flag and the command did not pass it. Its grant is
      # SEPARATE from --platform-admin on purpose, because that one administers tenants while this
      # one creates the principals inside them.
      - --platform-user-routes
      - --platform-user-role
      - platform_admin
      # The replay guard defaults to a Map in one process, so a retried mutation re-executes after
      # a restart and on a second replica — including on the deletion route, the one route that
      # *requires* an Idempotency-Key. Durable here (ADR-0336, which measured a retry after a
      # restart reading `replay_hit_match` with this flag and `first_seen` without it); the reaper
      # is mounted by the store and needs no second flag. The guarantee is bounded and stated:
      # there is no reserve step, so two *concurrent* retries of one key both execute and only the
      # sequential case is closed, which is what clients actually produce.
      - --idempotency-store
      - pg
      # Mounts POST /v1/auth/token, which is what makes the UI's login work. Needs CREDENTIAL_PEPPER
      # and OPERATE_TOKEN_SIGNING_KEY above, and the issuer/audience below -- the minted token
      # asserts both and the gateway beside it verifies both, so they are one declaration.
      #
      # The first password is not set from here. There is no mail channel in a fresh deployment, so
      # an operator with shell access is the only principal that exists before the first password
      # does:
      #
      #   docker compose exec -e OPERATE_NEW_PASSWORD='<password>' api \
      #     node apps/operate-server/dist/bin/operate-server.js set-credential \
      #     --user <meta.users id> --confirm-user <the same id>
      #
      # and the user itself comes from POST /v1/platform/users under --platform-user-routes. The
      # password is read from the environment and never from argv, for the `ps` reason above; the
      # subcommand refuses `--password` by name and says so.
      - --credential-login
      # Lets a platform_admin set ANOTHER user's password from the console, over
      # POST /v1/platform/users/{id}/credential. Without it that act needs a shell -- and that is
      # where onboarding used to break: the tenant and the user are both creatable over HTTP, so
      # the only step that needed `docker compose exec` was the third of four.
      #
      # The same role as --platform-admin and --platform-user-role here, deliberately, because on a
      # single-operator deployment they are one person and pretending otherwise buys nothing. The
      # flag is separate because the privileges are: meta.users has no RLS, so this route's role
      # check is the entire authorisation with no policy behind it, and a deployment that wants the
      # people who provision identities to be a different set from the people who can take one over
      # changes this line alone.
      #
      # It cannot be aimed at a caller that names a person (403 self_not_permitted), which is the
      # case that matters: a signed-in operator cannot replace their own credential through a route
      # that never asks for the current one. The bootstrap api key below names no person -- a
      # `token:role:tenant` spec resolves to a service account on a shared placeholder id (ADR-0331)
      # -- so for THAT credential the refusal cannot fire, and there is nothing for it to protect
      # either, since a service account has no password to take over.
      #
      # Changing your OWN password is POST /v1/account/password, which needs no grant and mounts
      # with --credential-login above -- so every user of this deployment can now change their
      # password, which no deployment could do before. That route honours the login's account
      # lockout, so a wrong current password counts toward the same lock a wrong login does.
      - --credential-admin-role
      - platform_admin
      # Who may read and write THIS TENANT'S OWN settings -- GET/PUT /v1/admin/settings, the two
      # routes behind the console's Settings and Billing pages. Repeatable, and BOTH names are
      # needed here for a measured reason rather than for symmetry:
      #
      #   - erp_admin is the default the binary falls back to with no flag, and dropping it would
      #     lock out every tenant administrator this pack declares;
      #   - platform_admin is the role the bootstrap operator above holds, in BOTH the api-key spec
      #     and the membership the documented walkthrough grants -- and before this flag existed
      #     that operator got a 403 on their own tenant's settings while the sidebar linked to the
      #     page unconditionally. The grant is not a manifest role and is not meant to be: the
      #     check is a set membership over the roles a caller's SESSION carries, which come from
      #     their membership, so an undeclared name works here where it would be inert in a
      #     manifest-driven grant.
      #
      # These two routes are mounted on every deployment and deliberately sit OUTSIDE the
      # subscription gate, so a lapsed tenant can still open its billing screen -- which is why a
      # wrong grant here is a dead page rather than a disclosure, and why the boot `[settings]` line
      # states who holds it either way.
      - --admin-role
      - erp_admin
      - --admin-role
      - platform_admin
      # The issuer and audience the token asserts and the gateway checks. They are this
      # deployment's own names -- nothing external resolves them -- but they must agree, and
      # without them the runtime falls back to `https://crossengin.io` and refuses a token minted
      # under any other issuer.
      - --jwt-issuer
      - https://${DOMAIN:-localhost}/
      - --jwt-audience
      - crossengin-operate
      # Mounts /v1/ai — a tenant describes their business and the Architect designs a manifest.
      # This comment used to go on "a reviewer approves it, and activating it makes it that
      # tenant's live schema", and BOTH halves were false on this file. Approval is false no
      # longer: `--require-design-review` is passed below. The second half is still false and is
      # stated here rather than implied, because an operator reads it and plans around it — on
      # `--store pg` NO per-tenant Postgres schema is ever applied. `applyTenantManifestSchema`'s
      # only caller is `TenantColumnStoreRegistry.ensure`, and that registry is constructed only
      # for a `ColumnMappedEntityStore`, so an activated manifest's entities land in the shared
      # JSONB table keyed (tenant_id, entity, record_id) — correct and isolated, but not the typed
      # tables ADR-0314 describes. `--store pg-columns` is what turns that on, and it is a store
      # decision rather than a flag: see the OPERATE_PACK note above, since the column store
      # refuses a classified field with no COLUMN_ENCRYPTION_SECRET and the Architect's own prompt
      # instructs the model to classify PHI.
      #
      # Safe to carry unconditionally, on two measured grounds. With no provider configured it MOUNTS AND WARNS
      # (`[ai-design] no AI provider configured …`) and POST /v1/ai/design answers 503 rather than
      # refusing the boot. And it implies --per-tenant-manifests, which is additive here: a tenant
      # with no activated manifest resolves `kind: "none"` and is served this boot pack by
      # `defaultDispatch`, exactly as before (ADR-0314).
      #
      # Provider precedence is local → Anthropic → OpenAI, and a local base URL that is SET BUT
      # MALFORMED refuses instead of falling through, so a stray ANTHROPIC_API_KEY cannot ship a
      # tenant's business description to a vendor the operator opted out of. Set one key in .env.
      #
      # `--ai-model` accepts only ids in @crossengin/ai-providers-anthropic's catalogue and an id
      # outside it SILENTLY falls back to the default (claude-sonnet-4-6) rather than refusing — so
      # it is left unset here, where the default is at least stated.
      - --ai-design
      # BOTH, because this flag REPLACES its default rather than adding to it, and the default is
      # `["erp_admin", "platform_admin"]` (cli.ts). Passing only the first silently dropped the
      # second — which reads as someone writing the default out and stopping half way, and the
      # consequence is sharp on this file specifically: `platform_admin` is the role that provisions
      # tenants and users, so it is the one login a single-operator deployment actually has, and it
      # was the one refused at the AI Studio. The Architect is the headline feature and the operator
      # could not reach it without inventing a second tenant and a second membership, because
      # `meta.user_tenant_membership` is UNIQUE (user_id, tenant_id).
      #
      # `erp_admin` stays first and is not redundant: a tenant's own administrator designs their own
      # system, which is the flow /setup exists for, and `platform_admin` is not one of erp-core's
      # fifteen declared roles so it reaches no entity page at all. The two are different jobs on one
      # surface rather than one job spelled twice.
      - --ai-design-role
      - erp_admin
      - --ai-design-role
      - platform_admin
      # Nothing may activate a manifest until a platform reviewer approves it. ONE flag, because
      # `--require-design-review` sets `designReview` too (cli.ts) — and passing `--design-review`
      # ALONE would be worse than passing neither: the review routes would mount over a
      # permanently empty queue, since enrolment is gated on `requireDesignReview` and the
      # catalog's `review_status` default is `not_required`, which the activation gate denies. So
      # a reviewer would see "nothing pending" while every proposal activated unreviewed.
      #
      # Without it `reviewGate` is simply absent from the design routes and the activation handler
      # skips the check, so the TENANT'S OWN erp_admin designs a manifest, reviews their own diff
      # in /setup and clicks Activate. That is not a missing feature, it is a one-click path to a
      # tenant replacing their own ERP: before this increment an activated manifest REPLACED the
      # boot pack outright, and with lineage resolution it now merges over it — in either case a
      # model's output decides what the tenant is served, and a model replying with the fifteen
      # characters `{"entities":[]}` is an accepted design.
      #
      # It is a behaviour change for proposals minted beforehand, deliberately: the gate denies
      # `not_required` as well as `rejected`, so any draft created before this flag became live is
      # permanently unactivatable and has to be designed again. That is the correct direction —
      # turning review on must not leave a back door open behind it — and it is why this is a
      # sentence here rather than a surprise.
      - --require-design-review
      # The role that decides reviews. Stated rather than defaulted even though `platform_admin`
      # IS the default, because this is the one grant that separates "designs the system" from
      # "approves the system", and a four-eyes-shaped decision should be visible in the file an
      # operator edits rather than read out of a CLI default. A tenant's own `erp_admin` holds
      # --ai-design-role above and NOT this one, which is what makes the separation real.
      - --design-review-role
      - platform_admin
      # Both ceilings are per tenant. The monthly one bounds the bill; the per-REQUEST one is
      # refused before the call rather than discovered after it, and is OFF by default — so without
      # it a single prompt is unbounded. Neither is a guess an operator should have to make blind:
      # raise them once the first real designs show what a manifest costs.
      - --ai-max-usd-per-month
      - "50"
      - --ai-max-request-dollars
      - "2"
      # Nothing in this binary delivers a notification except the drain, `in_app` included -- so
      # without this flag the review decision this file turns on above is written to
      # `meta.notification_dispatches` and never reaches the tenant, and the inbox is permanently
      # empty. 15s because the only live producer here is a human approving a design: the latency
      # that matters is "did the tenant hear", not throughput.
      #
      # Measured, which is why it is a default rather than a note: boot used to print
      # `[notify] channels: in_app` and NOTHING else, because the drain-absence warning was gated on
      # `channels.length > 1` and this stack configures no SES or Twilio variable -- so the one line
      # an operator read said the channel was registered and nothing said it would never be sent.
      - --notification-drain-ms
      - "15000"
      # Per-viewer notification read state: POST /v1/notifications/{id}/read, the read-through
      # watermark, and the unread count the sidebar badge renders. Withheld from this file in
      # ADR-0376 on one stated ground -- "it is blocked on a SURFACE and not on a default decision:
      # a notifications page plus a mark-read affordance, and then this flag on the same day" --
      # and that page is `/notifications` in `operate-web`, so the argument is spent rather than
      # overruled. Without the flag every badge fetch answers
      # `404 no route for GET /v1/notifications/unread` and the client falls back to counting
      # notices from the last seven days, which cannot tell read from unread.
      #
      # It is ONE surface and TWO flags because the grant has no default: `readStateRoles` starts
      # empty, so `--read-state-routes` alone mounts routes that refuse every request and says so
      # at boot (`is on with no --read-state-role: every request will be refused`).
      #
      # BOTH roles, which is the same shape as --ai-design-role above and for a measured reason.
      # The flag is repeatable and additive (it replaces no default), and the boot line NAMES the
      # granted roles because a console user whose membership carries a role not on that line is
      # silently back on the approximation. The bootstrap in `.env.example` grants
      # `primaryRole: "platform_admin"` and no secondary roles, so that is the one login a fresh
      # deployment has; `erp_admin` is the role that same file tells you to name for somebody who
      # is meant to USE the ERP, and it is the role /setup's designer holds. Naming one would leave
      # the other quietly approximating.
      #
      # `--read-state-backfill-role` is deliberately NOT here. It is additive on top of these (the
      # CLI refuses a backfill role that is not also granted above) and it marks a whole backlog
      # read in one call, which is a go-live migration rather than a default. It is also the one
      # grant here that gates something: `resolveViewer` takes the viewer from the credential
      # unconditionally and a body naming one is refused, so the roles above gate a principal's
      # access to its OWN row (ADR-0364 made that argument for /v1/account/password needing no
      # grant) while the backfill role gates writing somebody's whole history read.
      - --read-state-routes
      - --read-state-role
      - erp_admin
      - --read-state-role
      - platform_admin
      # Enforce `meta.tenants.status` on every request: a suspended, archived or pending_deletion
      # tenant is read-only and a deleted one is refused. `/v1/platform` routes are exempt, because
      # the gate answers for the tenant a request ACTS ON and a platform route acts on the
      # deployment -- which is what keeps the bootstrap above runnable, since OPERATE_API_KEY_SPECS
      # names a placeholder tenant uuid that has no `meta.tenants` row.
      #
      # ADR-0334 left it opt-in on the stated grounds that on-by-default "would refuse requests of a
      # deployment that works today". Measured on this stack, it does not: the shipped key carries
      # `platform_admin`, which grants 0 of erp-core's 255 (entity, operation) pairs, so
      # `GET /v1/vendors` with it was ALREADY a 403 and the gate only changes which 403 and improves
      # the diagnosis. What it does change is the case an operator reaches by following the comment
      # on OPERATE_ADMIN_API_KEY above -- an api-key naming "any placeholder tenant uuid" with a real
      # ERP role was served **200 over a tenant that has no row**, writing records under a tenant_id
      # with no parent. The gate makes that a 403 naming the tenant, and the boot survey lists every
      # such configured tenant by uuid BEFORE the first request.
      #
      # So EXPECT A BOOT ERROR LINE on a fresh stack and do not read it as the default having broken
      # the deployment: `[tenant-status] 1 configured API-key tenant(s) have no meta.tenants row and
      # EVERY request from them will be refused 403: 00000000-...-000000000000`. It is correct and it
      # is about the placeholder above. It goes away by pointing a key at a provisioned tenant, which
      # you can only do after step 1 of the bootstrap, since the id is minted by the server.
      - --tenant-status-gate
      # The two tamper-evidence passes, defaulted on because the chain they witness now has a
      # route (AUDIT_CHAIN_SIGNING_KEY above). Without the chain these two had nothing to anchor or
      # verify; with it and without these, every audited row is appended to the chain and nobody
      # ever folds it — a hash-linked trail nothing checks is not a tamper-evident trail, it is a
      # log with extra columns.
      #
      # BOOLEANS and not `--checkpoint-config <file>` / `--integrity-proof-config <file>`, for two
      # reasons that compose. The file had no route here at all: this service declares no `volumes:`
      # key, so the only way one reached the container was a commit baked into an image layer, which
      # costs a full install+build to change one word. And the file's documented content was a
      # TRAP -- `{}` parses, and an empty config resolves to the PLATFORM chain alone, which on a
      # deployment passing no escalation flag is empty, and an empty scope's report is discarded
      # entirely. Measured live at a 2s tick: `{}` gave 0 anchors, 0 verdicts and **0 log lines**
      # over three passes while the tenant's chain held an entry; `allTenants` gave 4 / 4 / 8.
      # These flags mount the schema's defaults plus `allTenants`, over EVERY tenant status rather
      # than only `active` -- the four chain tables are retained by the Article 17 erasure precisely
      # so an auditor can read them after the tenant is gone, so a pass that skips a retired tenant
      # skips the trail the retention rule exists to protect.
      #
      # What each prints at boot: `[checkpoint] scope: every tenant with status ...` and
      # `[integrity-proof] scope: ...`. A deployment wanting a narrower scope, a different interval
      # or an escalation policy passes the file flag instead; the two are mutually exclusive.
      #
      # Cost: one full fold per scope the FIRST time it is covered (~107 µs per chain entry, so
      # about a second at 10k entries), then every later pass is bounded from the anchor.
      - --checkpoints
      - --integrity-proof
    expose:
      - "8787"
    # Published on the LOOPBACK ONLY, which is what makes the documented bootstrap runnable.
    #
    # `expose:` above advertises the port on the compose network -- `web` and `caddy` reach it as
    # `api:8787` -- and publishes nothing on the host, so `curl http://localhost:8787/...` from this
    # VM's shell connected to nothing. Every bootstrap command in `.env.example` was written against
    # that address, so the only documented path to the first login could not be followed as written.
    #
    # The alternative was to rewrite those commands against `https://api.$DOMAIN`, and it is the
    # worse one: the bootstrap is precisely the moment DNS may not have propagated and Caddy may not
    # yet hold a certificate, so it would make creating the first user depend on the TLS layer being
    # up. `127.0.0.1:` is the whole of the binding and not a formality -- a bare `8787:8787` would
    # publish on every interface, and on a cloud VM that is the public one, which would put an
    # unauthenticated-at-the-edge API port on the internet behind whatever the host firewall happens
    # to allow. Bound to loopback it is reachable by exactly the population that can already run
    # `docker compose exec`, so it adds no exposure and removes a dependency.
    ports:
      - "127.0.0.1:8787:8787"
    # `/readyz`, not `/health`: this check's job is to decide whether `web` and `caddy` may be
    # pointed at the API, which is a readiness question. The API's boot is full of deliberate
    # refusals (a classified pack with no COLUMN_ENCRYPTION_SECRET, an undischargeable ABAC
    # obligation, `envelope` on a deployment that encrypts nothing) and every one exits the
    # process — and without this, compose reported the container `started` the moment it was
    # spawned, Caddy was pointed at it regardless, and the public domain served 502 while nothing
    # in the stack held the opinion that anything was wrong.
    #
    # `start_period` covers a cold boot: the catalog admission survey and the per-tenant key
    # provisioning both run before the listener binds.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    logging: *logging
    restart: unless-stopped

  web:
    build: *app-build
    depends_on:
      api:
        # `service_healthy` and not `service_started`: the UI's every page is a proxy call to the
        # API, so starting it against an API that is still booting — or that refused to boot — just
        # moves the 502 one hop.
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The web app's server-side proxy calls the API over the internal network.
      #
      # There is no OPERATE_API_KEY here any more, and that is the point of this increment. The
      # proxy used to stamp one shared `platform_admin` key on every request, so every browser that
      # resolved the domain WAS that principal -- it could provision and delete tenants, and Caddy
      # forwards without checking a credential. It now reads the viewer's own session cookie and
      # sends their token, and with no cookie it answers 401 without calling the API at all. The
      # variable is gone rather than defaulted, because `?? "devkey"` meant deleting it did not
      # fail closed.
      OPERATE_API_URL: http://api:8787
    # next start binds 0.0.0.0:3000 by default; Caddy reaches it as web:3000.
    # `node` and the Next binary directly: the runtime image carries no pnpm (deploy/Dockerfile), so
    # the `pnpm --filter … start` this used to run would not start at all.
    working_dir: /app/apps/operate-web
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3000"]
    expose:
      - "3000"
    # /login and not /: the login page is served without a session and without calling the API, so
    # it answers 200 exactly when Next itself is serving. `/` redirects to it with no cookie, and a
    # page that proxies to the API would make this a second check of `api`'s.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    logging: *logging
    restart: unless-stopped

  # A verified dump of the database every BACKUP_INTERVAL_SECONDS (a day by default), kept for
  # BACKUP_RETENTION_DAYS (14). Each dump is RESTORED into a scratch database and its table count
  # compared with the source before it is kept, so what this directory holds is a tested restore;
  # a failed run leaves the previous dumps untouched and the service unhealthy until the next one
  # succeeds. It runs as the owner, because the API's app role is confined by RLS and its dump would
  # silently omit every tenant's rows. The dumps are on THIS host's disk: copy them somewhere else
  # (deploy/README.md, "Backups"), because a backup on the disk it protects survives nothing that
  # loses the disk.
  backup:
    build:
      context: ./postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *pg-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-600}
      BACKUP_RESTORE_CHECK: ${BACKUP_RESTORE_CHECK:-1}
    user: postgres
    entrypoint: ["crossengin-backup"]
    volumes:
      - ${BACKUP_DIR:-db-backups}:/backups
    # Healthy while the newest verified dump is younger than two intervals AND the latest run did not
    # fail. The age alone kept a failing service healthy for up to two days after its last good run
    # (measured: FAILED in the log, `(healthy)` in `ps`); the script writes .last-failed on a failed
    # run and removes it on a successful one. The start period is long because the first run happens
    # at start and includes a full restore.
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /backups/.last-failed && test $$(( $$(date +%s) - $$(cat /backups/.last-verified 2>/dev/null || echo 0) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS:-86400} * 2 ))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15m
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    logging: *logging
    restart: unless-stopped

  caddy:
    # Pinned to an exact release, like the Node and Postgres bases: `caddy:2` is whatever 2.x was
    # last pushed, so two hosts built a month apart terminated TLS with different code.
    image: caddy:2.11.9
    depends_on:
      # Healthy, not merely started: Caddy otherwise serves the public domain a 502 while either
      # upstream is still booting or has refused to boot.
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    logging: *logging
    restart: unless-stopped

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
