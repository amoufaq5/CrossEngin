# Overlay: run the LLM on this box too, so the whole platform — database, API, UI,
# TLS *and* the model — is one `docker compose up` with nothing leaving the VM.
#
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
#
# Add docker-compose.ai-gpu.yml as a third -f on a GPU host. Without a GPU this
# still works, but slowly: a 7B model on two Ampere A1 cores generates a few
# tokens a second, so one design can take tens of minutes — fine to try, not
# fine for tenants. On Oracle's Always Free shape (2 OCPU / 12 GB) a hosted key
# is the practical choice; the default here is a 7B model because a 14B one
# (~9 GB) does not fit in 12 GB beside the database, API and UI.

services:
  ollama:
    # An exact release and never `latest`, which CLAUDE.md forbids and which here would let a rebuild
    # change the model runtime under a deployment that changed nothing. The two services name the same
    # tag so the pull and the server agree on the on-disk model format.
    image: ollama/ollama:0.40.16
    environment:
      # A design prompt is ~3-4k tokens and asks for up to 8k of output, which Ollama's small
      # default context window would truncate into a design that fails truncated_json.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-8g}
    volumes:
      - ollama-models:/root/.ollama
    # Never published: only the api service reaches it, over the compose network.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # One-shot: pulls the model into the shared volume before the API needs it.
  # Idempotent — a model already present is a no-op, so this is safe on every `up`.
  ai-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OPERATE_AI_MODEL:-qwen2.5:7b-instruct}"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: "no"

  api:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app-role:
        condition: service_completed_successfully
      eraser-role:
        condition: service_completed_successfully
      document-indexes:
        condition: service_completed_successfully
      ai-pull:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      # The app role and never POSTGRES_USER, for the base file's reason: this key replaces the
      # base's, so naming the owner here would hand the self-hosted-AI path a session every RLS
      # policy is inert for.
      PGUSER: ${POSTGRES_APP_USER:-${POSTGRES_USER}}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      PGDATABASE: ${POSTGRES_DB}
      NODE_ENV: production
      # `ai-providers-local`, not `ai-providers-openai` with a base URL (ADR-0306). Both reach Ollama's
      # OpenAI-compatible endpoint, but the local provider prices at zero — so the per-tenant AI budget
      # guard stops refusing design requests over tokens that cost nothing, and the transcript names the
      # provider that actually served the turn.
      # WITH /v1: the local provider appends `/chat/completions`, and Ollama's OpenAI-compatible
      # route is /v1/chat/completions. Without it every design answered a 404 (the value was carried
      # over from the OpenAI provider, which appends /v1 itself, when the overlay switched providers).
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      # Optional — the local provider omits the header when this is empty, which is what Ollama wants;
      # a vLLM box behind an auth proxy needs it. Deliberately not `OPENAI_API_KEY`: that name would be
      # picked up by the real OpenAI client if the base URL above were ever unset, turning a
      # self-hosted deployment into cloud calls with a placeholder key.
      LOCAL_LLM_API_KEY: ${OPERATE_AI_API_KEY:-}
      # The model, which used to be `--ai-model` on a `command:` this file had to repeat in full.
      #
      # There is **no `command:` here any more**, and that is the whole point of this block. Compose
      # REPLACES a `command` rather than merging it, so adding one flag meant copying all of them,
      # and the copy carried the comment *"Keep the two in step when either changes."* Nobody did:
      # by ADR-0364 it was **ten flags behind** the base — no `--credential-login`, so this entire
      # self-hosted path had no login at all and the web app it ships with could authenticate
      # nobody; no `--platform-user-routes`; no `--idempotency-store pg`; no `--jwt-issuer` — and it
      # still passed `--api-key` on argv, which ADR-0357 removed from the base because `ps` reads it.
      #
      # `environment:` MERGES across files where `command` replaces, so with the model reachable
      # from the environment this overlay adds the AI wiring and inherits every flag and every
      # variable the base declares. There is nothing left to keep in step, which is the only fix
      # that has ever worked on this class (ADR-0288): make the duplicate unnecessary rather than
      # correct. `--ai-design` is already on the base command.
      OPERATE_AI_MODEL: ${OPERATE_AI_MODEL:-qwen2.5:7b-instruct}
      # A CPU-only model can take longer than the default 120 s to send its first token on a ~4k
      # token prompt; the timeout is an inactivity deadline, so a slow stream is never cut off.
      OPERATE_AI_PROVIDER_TIMEOUT_MS: ${OPERATE_AI_PROVIDER_TIMEOUT_MS:-900000}

volumes:
  ollama-models:
