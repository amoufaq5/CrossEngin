# The workspace's only CI pipeline.
#
# This file is NOT the declaration — `CI_PIPELINE` in
# packages/testing/src/strategy/ci.ts is, and
# packages/testing/src/strategy/ci-workflow.ts compares the two in both
# directions on every test run. A step added here and not there, or there and
# not here, is a test failure naming the step. Read that constant's doc comment
# before changing anything below: it carries the measurement behind the step
# order, the Node pin and the nine-minute budget.
#
# Five top-level keys and nothing else. `permissions:` and `concurrency:` are
# declared on CI_PIPELINE like every step (ADR-0482), so the fence's claim still
# holds: every line in this file that executes or grants anything is declared.
# `timeout-minutes:` on each job bounds a hang and is not the budget.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high --prod
      - name: Workspace rules
        run: pnpm --filter @crossengin/testing test
      - name: Build
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Lint
        run: pnpm lint
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build and boot the compose stack
        run: bash deploy/ci-smoke.sh
